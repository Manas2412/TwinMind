name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # never cancel a half-finished prod deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. manas2412/twinmind

jobs:
  # ── 1. Build the production image and push to GHCR ─────────────────────────
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # required to push to GHCR
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ── 2. SSH to EC2, pull the new image, restart compose ─────────────────────
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}

    steps:
      - name: Copy compose + Caddyfile to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "docker-compose.yml,Caddyfile"
          target:   "/home/${{ secrets.EC2_USER }}/twinmind"
          # Pulls fresh copies each deploy so any change to compose/Caddyfile lands.
          overwrite: true

      - name: Pull image & restart on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          # Sensitive values are passed via env over SSH, never echoed into logs.
          envs: IMAGE_TAG,APP_DOMAIN,ACME_EMAIL,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd "/home/${{ secrets.EC2_USER }}/twinmind"

            # Persist the env file the compose project consumes.
            cat > .env <<EOF
            IMAGE_TAG=ghcr.io/${{ github.repository }}:sha-${{ needs.build-and-push.outputs.image_tag }}
            APP_DOMAIN=${{ vars.APP_DOMAIN }}
            ACME_EMAIL=${{ vars.ACME_EMAIL }}
            EOF

            # Authenticate to GHCR (private images) and pull the new tag.
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USER }}" --password-stdin

            docker compose pull app
            docker compose up -d --remove-orphans

            # Wait for healthcheck to flip to "healthy" — fail the deploy otherwise.
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' twinmind-app || echo "starting")
              echo "[$i/30] app health: $status"
              if [ "$status" = "healthy" ]; then exit 0; fi
              sleep 2
            done
            echo "App did not become healthy in time — rolling logs:"
            docker compose logs --tail=80 app
            exit 1

      - name: Prune dangling images on EC2
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker image prune -f
